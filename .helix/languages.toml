[[language]]
name = "typescript"
language-servers = ["typescript-language-server"]
auto-format = true
formatter = { command = "bunx", args = ["biome", "format", "--stdin-file-path", "%{buffer_name}"] }

[[language]]
name = "tsx"
language-servers = ["typescript-language-server"]
auto-format = true
formatter = { command = "bunx", args = ["biome", "format", "--stdin-file-path", "%{buffer_name}"] }

[[language]]
name = "javascript"
auto-format = true
formatter = { command = "bunx", args = ["biome", "format", "--stdin-file-path", "%{buffer_name}"] }

[[language]]
name = "jsx"
auto-format = true
formatter = { command = "bunx", args = ["biome", "format", "--stdin-file-path", "%{buffer_name}"] }

[language-server.typescript-language-server.config]
hostInfo = "helix"
tsserver = { path = "/Users/user/Code/garden/node_modules/typescript/lib/tsserver.js" }
